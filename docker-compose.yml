services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: frameafrica
    ports:
      - '5432:5432'
    volumes:
      - frameafrica-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - frameafrica-redis:/data

volumes:
  frameafrica-postgres:
  frameafrica-redis:
