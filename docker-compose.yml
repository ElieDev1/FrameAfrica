services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: frameafrica
    ports:
      # Host port 5433, not 5432 — avoids clashing with a locally installed
      # PostgreSQL service. Update DATABASE_URL in .env to match.
      - '5433:5432'
    volumes:
      - frameafrica-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - frameafrica-redis:/data

volumes:
  frameafrica-postgres:
  frameafrica-redis:
