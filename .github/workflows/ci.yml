# Frame Africa — Continuous Integration
# Runs on PRs and pushes to dev/main. Enforces the checks required by
# documents/09-Git-Workflow.md and documents/08-Test-Deployment.md.

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed before setup-node so its `cache: pnpm` can find it.
      - name: Install pnpm
        # No `version:` — the action reads `packageManager` from package.json
        # (pnpm@9.15.0). Specifying both is an error in action-setup v4.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit & integration tests
        run: pnpm test -- --coverage

      - name: Build
        run: pnpm build

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks diffs the PR's commit range, so it needs the history —
          # the default shallow clone makes it fail to scan the repository.
          fetch-depth: 0

      - name: Dependency audit
        run: pnpm audit --audit-level=high || true

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required since gitleaks-action v2 to scan pull requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: SAST (CodeQL) — enable via GitHub "Code scanning"
      #   uses: github/codeql-action/analyze@v3

  e2e:
    name: E2E (critical journeys)
    needs: [quality]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: frameafrica
          POSTGRES_PASSWORD: frameafrica
          POSTGRES_DB: frameafrica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frameafrica"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://frameafrica:frameafrica@localhost:5432/frameafrica
      JWT_ACCESS_SECRET: ci-e2e-not-a-real-secret
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000/v1
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        # No `version:` — the action reads `packageManager` from package.json
        # (pnpm@9.15.0). Specifying both is an error in action-setup v4.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate + seed database
        run: |
          pnpm --filter api exec prisma migrate deploy
          pnpm --filter api run db:seed

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build API + web
        run: |
          pnpm --filter api build
          pnpm --filter web build

      - name: Start API + web
        run: |
          pnpm --filter api start:prod &
          pnpm --filter web start &

      - name: Wait for servers
        run: npx --yes wait-on -t 60000 http://localhost:4000/health http://localhost:3000

      - name: Run E2E tests
        run: pnpm --filter web e2e

# NOTE:
# - Branch protection should require the "quality" and "security" checks to pass.
#   The "e2e" job is a critical-journey smoke check (opt into protection once it's
#   proven stable on your runner).
# - Deployment to staging (dev) and production (main) is handled by a separate
#   deploy workflow, gated on these checks + manual approval (see 08-Test-Deployment.md).
